<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#121018" />
  <title>MyCryptoTCG</title>

  <!-- OGP -->
  <meta property="og:title" content="MyCryptoTCG" />
  <meta property="og:description" content="MyCryptoTCG — MCH ヒーローで戦う、 64×64 ピクセルアニメ × 高速カードバトル" />
  <meta name="description" content="MyCryptoTCG — MCH ヒーローで戦う、 64×64 ピクセルアニメ × 高速カードバトル" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 fill=%22%23121018%22/><text x=%2232%22 y=%2244%22 text-anchor=%22middle%22 font-size=%2240%22 font-family=%22monospace%22 fill=%22%23e8e6f0%22>T</text></svg>" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/battle.css" />
  <link rel="stylesheet" href="css/effects.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- ============================================================ -->
  <!-- 1. Splash (= boot 中)                                          -->
  <!-- ============================================================ -->
  <div id="splash" class="splash">
    <div class="splash__logo">MyCryptoTCG</div>
    <div class="splash__loading" data-i18n="splash.loading">読み込み中…</div>
  </div>

  <!-- ============================================================ -->
  <!-- 2. Title screen                                               -->
  <!-- ============================================================ -->
  <section id="titleScreen" class="title-screen hidden">
    <h1 class="title-screen__title">MyCryptoTCG</h1>
    <p class="title-screen__sub" data-i18n="title.subtitle">サブタイトル</p>

    <div class="lang-toggle" id="langToggle">
      <span class="lang-toggle-label" data-i18n="lang.toggle.label">Language / 言語</span>
      <div class="lang-toggle-buttons">
        <button class="lang-btn" data-lang="ja">JP：日本語</button>
        <button class="lang-btn" data-lang="en">EN：English</button>
      </div>
    </div>

    <button id="btnPressStart" class="title-screen__press" data-i18n="title.press">
      Press to Start
    </button>
  </section>

  <!-- ============================================================ -->
  <!-- 3. Main app                                                    -->
  <!-- ============================================================ -->
  <main id="app" class="app hidden">
    <header class="header">
      <div class="header__left">
        <span class="header__title">MyCryptoTCG</span>
      </div>
      <div class="header__center">
        <span id="dateLabel">2018 年 1 月 1 週</span>
      </div>
      <div class="header__right">
        <button id="btnLangToggle" class="btn btn--ghost" title="Language">JP/EN</button>
        <button id="btnHelpOpen"   class="btn btn--ghost" title="Help">?</button>
      </div>
    </header>

    <section class="stage">
      <!-- ============================================================ -->
      <!-- Battle screen (= SPEC-104)                                    -->
      <!-- ============================================================ -->
      <div id="battleScreen" class="battle-screen hidden">

        <!-- CPU side (= top) -->
        <div class="battle-side battle-side--cpu">
          <div class="battle-side__info">
            <span class="battle-info-label" data-i18n="battle.label.opponent">対戦相手</span>
            <span class="battle-info-hp">
              <span data-i18n="battle.label.hp">HP</span>
              <span id="cpuHpValue" class="battle-info-num">10</span>
            </span>
            <span class="battle-info-stones">
              <span data-i18n="battle.label.stones">ストーン</span>
              <span id="cpuStonesValue" class="battle-info-num">0</span>
            </span>
            <span class="battle-info-hand">
              <span data-i18n="battle.label.hand">手札</span>
              <span id="cpuHandCount" class="battle-info-num">0</span>
            </span>
          </div>
          <div id="cpuHandBack" class="battle-hand battle-hand--back"></div>
          <div class="battle-field">
            <div id="cpuFieldBack" class="field-slot field-slot--empty" data-side="cpu" data-row="back">
              <span class="field-slot__placeholder" data-i18n="battle.slot.empty">(空)</span>
            </div>
            <div id="cpuFieldFront" class="field-slot field-slot--empty" data-side="cpu" data-row="front">
              <span class="field-slot__placeholder" data-i18n="battle.slot.empty">(空)</span>
            </div>
          </div>
        </div>

        <!-- Battle divider (= middle) -->
        <div id="battleDivider" class="battle-divider">
          <div class="battle-divider__left">
            <span id="battleTurnLabel" class="battle-divider__turn">Turn 1</span>
            <span id="battlePhaseLabel" class="battle-divider__phase"></span>
          </div>
          <div class="battle-divider__right">
            <button id="btnEndTurn" class="btn btn--ghost" data-i18n="battle.btn.endTurn">ターン終了</button>
          </div>
        </div>

        <!-- Player side (= bottom) -->
        <div class="battle-side battle-side--player">
          <div class="battle-field">
            <div id="playerFieldFront" class="field-slot field-slot--empty" data-side="player" data-row="front">
              <span class="field-slot__placeholder" data-i18n="battle.slot.empty">(空)</span>
            </div>
            <div id="playerFieldBack" class="field-slot field-slot--empty" data-side="player" data-row="back">
              <span class="field-slot__placeholder" data-i18n="battle.slot.empty">(空)</span>
            </div>
          </div>
          <div id="playerHand" class="battle-hand battle-hand--player"></div>
          <div class="battle-side__info">
            <span class="battle-info-label" data-i18n="battle.label.you">あなた</span>
            <span class="battle-info-hp">
              <span data-i18n="battle.label.hp">HP</span>
              <span id="playerHpValue" class="battle-info-num">10</span>
            </span>
            <span class="battle-info-stones">
              <span data-i18n="battle.label.stones">ストーン</span>
              <span id="playerStonesValue" class="battle-info-num">0</span>
            </span>
          </div>
        </div>

        <!-- Hint bar -->
        <div id="battleHint" class="battle-hint"></div>
      </div>

      <!-- Placeholder (= バトル外で表示する仮テキスト) -->
      <p id="stagePlaceholder" data-i18n="stage.placeholder" class="hidden">ここにゲーム本体を描画する</p>
    </section>
  </main>

  <!-- ============================================================ -->
  <!-- 4. Help overlay                                               -->
  <!-- ============================================================ -->
  <div id="helpOverlay" class="help-overlay hidden">
    <div class="help-card">
      <h2 data-i18n="help.title">ヘルプ</h2>
      <p data-i18n="help.body">ゲームの遊び方をここに書く。</p>
      <p data-i18n="help.timeNote">ホーム画面で待機している間のみ時間が進行します。</p>
      <button id="btnHelpClose" class="btn" data-i18n="btn.close">閉じる</button>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- 5. Effect layers                                               -->
  <!-- ============================================================ -->
  <div id="confettiLayer" class="confetti-layer hidden"></div>
  <div id="floatLayer"    class="float-layer hidden"></div>
  <div id="notifLayer"    class="notif-layer"></div>

  <!-- ============================================================ -->
  <!-- 6. Boot                                                        -->
  <!-- ============================================================ -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
